services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tripgo
      POSTGRES_PASSWORD: tripgo
      POSTGRES_DB: tripgo
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripgo -d tripgo"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: "postgres://tripgo:tripgo@db:5432/tripgo?sslmode=disable"
      HTTP_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: "10s"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  postgres_data: